<!doctype html><meta charset="utf-8"><title>AZM — contrôle des logos</title>
<style>
 body{margin:0;background:#000;color:#f4f5f6;font:15px Archivo,system-ui,sans-serif;padding:26px}
 h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#cefe01;margin:26px 0 6px}
 h1:first-child{margin-top:0}
 p{color:#8b9196;margin:0 0 18px;font-size:13px;max-width:70ch}
 .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
 .c{aspect-ratio:3/4;background:#0c0d0e;border:1px solid #ffffff1c;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:16px;position:relative;overflow:hidden}
 .c img.logo{height:calc(46px * var(--k,1));width:auto;max-width:76%;object-fit:contain;z-index:1;
    filter:grayscale(.3) drop-shadow(0 2px 12px #000000d9);opacity:.94;transition:filter .3s,opacity .3s,scale .35s}
 .c:hover img.logo{filter:grayscale(0) drop-shadow(0 2px 14px #000000e6);opacity:1;scale:1.05}
 .c[data-b="audi"]{--k:.66} .c[data-b="chevrolet"]{--k:.72} .c[data-b="mclaren"]{--k:.84}
 .c[data-b="toyota"]{--k:.94} .c[data-b="ferrari"]{--k:1.32} .c[data-b="porsche"]{--k:1.3}
 .c[data-b="lamborghini"]{--k:1.34}
 .c span{font:500 11px "IBM Plex Mono",monospace;color:#8b9196;z-index:1}
 .c .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.46;
    filter:grayscale(1) contrast(1.12) brightness(.72)}
 .c::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000059,#0000008c 52%,#000000f5)}
 .plain .bg,.plain::after{display:none}
</style>
<h1>1 · Sur fond noir seul</h1>
<p>C'est le pire cas : si un logo disparaît ici, c'est qu'il est trop sombre.</p>
<div class="g" id="a"></div>
<h1>2 · Tel qu'il apparaît sur la page</h1>
<p>Logo posé sur la photo du char, traitée en noir et blanc assombri — le rendu réel.</p>
<div class="g" id="b"></div>
<script>
var BRANDS=[['bmw','BMW'],['porsche','Porsche'],['mclaren','McLaren'],['ferrari','Ferrari'],['audi','Audi'],
            ['lamborghini','Lamborghini'],['mercedes-amg','Mercedes-AMG'],['chevrolet','Chevrolet'],['toyota','Toyota']];
var CAT=window.AZM_CATALOG;
function paint(box,plain){
  box.innerHTML='';
  BRANDS.forEach(function(p){
    var d=document.createElement('div'); d.className='c'+(plain?' plain':''); d.dataset.b=p[0];
    var photo='';
    if(!plain&&CAT){ var m=CAT.makes.filter(function(x){return x.make===p[1];})[0];
      if(m&&m.image) photo='<img class="bg" src="'+m.image+'?width=600" alt="">'; }
    d.innerHTML=photo+'<img class="logo" src="public/assets/brands/'+p[0]+'.svg" alt=""><span>'+p[0]+'</span>';
    box.appendChild(d);
  });
}
paint(document.getElementById('a'),true);
paint(document.getElementById('b'),false);
</script>
<script src="catalog.js" onload="paint(document.getElementById('b'),false)"></script>
